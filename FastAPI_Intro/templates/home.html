<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Sensors</title>
</head>
<body>
    <h1>Home Page</h1>
    <p>This uses templates!</p>
    {% for reading in readings %}
    <h2>{{reading.sensor}}</h2>
    <p>{{reading.content}}</p>
    <p>{{reading.date_timestamp}}</p>
    {% endfor %}
</body>
</html>
